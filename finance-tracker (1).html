<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finance Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex}
  /* PIN Screen */
  #pin-screen{position:fixed;inset:0;background:#0f1117;display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:24px}
  .pin-box{background:#1a1d27;border:1px solid #2d3148;border-radius:16px;padding:40px 48px;text-align:center;min-width:320px}
  .pin-box h2{font-size:1.4rem;font-weight:600;margin-bottom:8px;color:#e2e8f0}
  .pin-box p{color:#6b7280;font-size:.875rem;margin-bottom:28px}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #3d4466;background:transparent;transition:.2s}
  .pin-dot.filled{background:#6366f1;border-color:#6366f1}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .pin-btn{background:#22263a;border:1px solid #2d3148;color:#e2e8f0;border-radius:12px;padding:16px;font-size:1.2rem;cursor:pointer;transition:.15s}
  .pin-btn:hover{background:#2d3148;border-color:#6366f1}
  .pin-btn.del{font-size:.9rem;color:#9ca3af}
  .pin-error{color:#ef4444;font-size:.8rem;margin-top:12px;min-height:18px}
  /* Layout */
  #app{display:none;width:100%;min-height:100vh}
  .sidebar{width:220px;background:#13161f;border-right:1px solid #1f2235;padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0}
  .logo{font-size:1.1rem;font-weight:700;color:#6366f1;padding:8px 12px;margin-bottom:16px;letter-spacing:.5px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:#9ca3af;font-size:.875rem;transition:.15s}
  .nav-item:hover{background:#1a1d27;color:#e2e8f0}
  .nav-item.active{background:#1e2035;color:#6366f1;font-weight:500}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .main{margin-left:220px;padding:32px;flex:1}
  .page{display:none}
  .page.active{display:block}
  /* Cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
  .card{background:#1a1d27;border:1px solid #1f2235;border-radius:14px;padding:20px 24px}
  .card-label{font-size:.75rem;color:#6b7280;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .card-val{font-size:1.6rem;font-weight:700;color:#e2e8f0}
  .card-val.green{color:#22c55e}
  .card-val.red{color:#ef4444}
  .card-val.blue{color:#6366f1}
  .card-val.yellow{color:#f59e0b}
  /* Section title */
  .sect-title{font-size:1.1rem;font-weight:600;color:#e2e8f0;margin-bottom:16px}
  /* Transactions */
  .add-form{background:#1a1d27;border:1px solid #1f2235;border-radius:14px;padding:20px 24px;margin-bottom:24px}
  .form-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 2fr auto;gap:12px;align-items:end}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:.75rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.6px}
  input,select,textarea{background:#0f1117;border:1px solid #2d3148;color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:.875rem;outline:none;transition:.15s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:#6366f1}
  select option{background:#1a1d27}
  .btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.875rem;font-weight:500;transition:.15s}
  .btn-primary{background:#6366f1;color:#fff}
  .btn-primary:hover{background:#5254cc}
  .btn-danger{background:transparent;border:1px solid #ef4444;color:#ef4444;padding:5px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
  .btn-danger:hover{background:#ef444422}
  .tx-list{background:#1a1d27;border:1px solid #1f2235;border-radius:14px;overflow:hidden}
  .tx-item{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #1f2235}
  .tx-item:last-child{border-bottom:none}
  .tx-cat{background:#22263a;border-radius:8px;padding:6px 10px;font-size:.75rem;color:#9ca3af;min-width:90px;text-align:center}
  .tx-info{flex:1}
  .tx-note{font-size:.875rem;color:#e2e8f0}
  .tx-date{font-size:.75rem;color:#6b7280;margin-top:2px}
  .tx-amt{font-size:1rem;font-weight:600;min-width:100px;text-align:right}
  .tx-amt.inc{color:#22c55e}
  .tx-amt.exp{color:#ef4444}
  /* Budget */
  .budget-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .budget-card{background:#1a1d27;border:1px solid #1f2235;border-radius:14px;padding:20px}
  .budget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .budget-cat{font-size:.9rem;font-weight:500;color:#e2e8f0}
  .budget-amt{font-size:.85rem;color:#9ca3af}
  .progress-bar{height:8px;background:#22263a;border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;border-radius:99px;transition:.4s}
  .budget-footer{display:flex;justify-content:space-between;margin-top:8px;font-size:.75rem;color:#6b7280}
  /* Charts */
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .chart-card{background:#1a1d27;border:1px solid #1f2235;border-radius:14px;padding:24px}
  .chart-card h3{font-size:.95rem;font-weight:600;color:#e2e8f0;margin-bottom:20px}
  /* Settings */
  .settings-card{background:#1a1d27;border:1px solid #1f2235;border-radius:14px;padding:24px;max-width:400px}
  .settings-card h3{font-size:.95rem;font-weight:600;color:#e2e8f0;margin-bottom:20px}
  .settings-row{display:flex;flex-direction:column;gap:10px}
  /* Misc */
  .empty{color:#6b7280;font-size:.875rem;padding:32px;text-align:center}
  .badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:.7rem;font-weight:500;margin-left:6px}
  .badge-inc{background:#22c55e22;color:#22c55e}
  .badge-exp{background:#ef444422;color:#ef4444}
  .month-select{background:#1a1d27;border:1px solid #2d3148;color:#e2e8f0;border-radius:8px;padding:6px 12px;font-size:.8rem;outline:none;cursor:pointer;margin-bottom:16px}
  @media(max-width:768px){
    .sidebar{width:60px;padding:16px 8px}.logo{font-size:0;padding:8px}.nav-item span{display:none}
    .main{margin-left:60px;padding:16px}.form-row{grid-template-columns:1fr 1fr}.charts-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- PIN Screen -->
<div id="pin-screen">
  <div class="pin-box">
    <h2 id="pin-title">Welcome Back</h2>
    <p id="pin-sub">Enter your PIN to continue</p>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn" onclick="pinPress('')"></button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="sidebar">
    <div class="logo">💰 FinTrack</div>
    <div class="nav-item active" onclick="nav('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Dashboard</span>
    </div>
    <div class="nav-item" onclick="nav('transactions')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Transactions</span>
    </div>
    <div class="nav-item" onclick="nav('budget')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Budget</span>
    </div>
    <div class="nav-item" onclick="nav('charts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Charts</span>
    </div>
    <div class="nav-item" onclick="nav('settings')" style="margin-top:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </div>
  </div>
  <div class="main">
    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
      <div class="sect-title" style="font-size:1.4rem;margin-bottom:24px">Dashboard</div>
      <div class="cards" id="dash-cards"></div>
      <div class="sect-title">Recent Transactions</div>
      <div class="tx-list" id="dash-recent"></div>
    </div>
    <!-- Transactions -->
    <div class="page" id="page-transactions">
      <div class="sect-title" style="font-size:1.4rem;margin-bottom:24px">Transactions</div>
      <div class="add-form">
        <div class="form-row">
          <div class="form-group">
            <label>Type</label>
            <select id="tx-type"><option value="income">Income</option><option value="expense" selected>Expense</option></select>
          </div>
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="tx-amount" placeholder="0"/>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="tx-cat"></select>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="tx-date"/>
          </div>
          <div class="form-group">
            <label>Note</label>
            <input type="text" id="tx-note" placeholder="Optional note"/>
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <button class="btn btn-primary" onclick="addTransaction()">Add</button>
          </div>
        </div>
      </div>
      <select class="month-select" id="tx-month-filter" onchange="renderTransactions()"></select>
      <div class="tx-list" id="tx-list"></div>
    </div>
    <!-- Budget -->
    <div class="page" id="page-budget">
      <div class="sect-title" style="font-size:1.4rem;margin-bottom:8px">Budget</div>
      <p style="color:#6b7280;font-size:.85rem;margin-bottom:20px">Set monthly spending limits per category</p>
      <div class="add-form" style="max-width:500px;margin-bottom:24px">
        <div class="form-row" style="grid-template-columns:1fr 1fr auto">
          <div class="form-group">
            <label>Category</label>
            <select id="budget-cat"></select>
          </div>
          <div class="form-group">
            <label>Monthly Limit (₹)</label>
            <input type="number" id="budget-amt" placeholder="0"/>
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <button class="btn btn-primary" onclick="setBudget()">Set</button>
          </div>
        </div>
      </div>
      <div class="budget-grid" id="budget-grid"></div>
    </div>
    <!-- Charts -->
    <div class="page" id="page-charts">
      <div class="sect-title" style="font-size:1.4rem;margin-bottom:24px">Charts</div>
      <div class="charts-grid">
        <div class="chart-card"><h3>Spending by Category</h3><canvas id="donut-chart" height="240"></canvas></div>
        <div class="chart-card"><h3>Monthly Income vs Expenses</h3><canvas id="bar-chart" height="240"></canvas></div>
      </div>
    </div>
    <!-- Settings -->
    <div class="page" id="page-settings">
      <div class="sect-title" style="font-size:1.4rem;margin-bottom:24px">Settings</div>
      <div class="settings-card">
        <h3>Change PIN</h3>
        <div class="settings-row">
          <div class="form-group"><label>Current PIN</label><input type="password" id="s-old" maxlength="4" placeholder="••••"/></div>
          <div class="form-group"><label>New PIN</label><input type="password" id="s-new" maxlength="4" placeholder="••••"/></div>
          <div class="form-group"><label>Confirm New PIN</label><input type="password" id="s-conf" maxlength="4" placeholder="••••"/></div>
          <button class="btn btn-primary" style="margin-top:8px" onclick="changePin()">Update PIN</button>
          <div style="color:#22c55e;font-size:.8rem;min-height:18px" id="pin-success"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const CATS_EXPENSE = ['Food','Transport','Shopping','Entertainment','Health','Utilities','Rent','Education','Other'];
const CATS_INCOME  = ['Salary','Freelance','Investment','Gift','Other'];
const COLORS = ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#ec4899','#84cc16','#f97316'];

let data = {txs:[], budgets:{}, pin:null};
let pinInput = '';
let isSetup = false;
let charts = {};

/* ---- Storage ---- */
async function load(){
  try{
    const r = await window.storage.get('fintrack_data');
    if(r) data = JSON.parse(r.value);
  }catch(e){}
}
async function save(){
  try{ await window.storage.set('fintrack_data', JSON.stringify(data)); }catch(e){}
}

/* ---- PIN ---- */
function initPin(){
  if(!data.pin){
    isSetup = true;
    document.getElementById('pin-title').textContent = 'Create PIN';
    document.getElementById('pin-sub').textContent = 'Set a 4-digit PIN to secure your data';
  }
}
function pinPress(d){
  if(!d) return;
  if(pinInput.length >= 4) return;
  pinInput += d;
  updateDots();
  if(pinInput.length === 4) setTimeout(submitPin, 200);
}
function pinDel(){ pinInput = pinInput.slice(0,-1); updateDots(); }
function updateDots(){
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled', i < pinInput.length);
}
let confirmPin = '';
function submitPin(){
  if(isSetup){
    if(!confirmPin){
      confirmPin = pinInput; pinInput = '';
      document.getElementById('pin-title').textContent = 'Confirm PIN';
      document.getElementById('pin-sub').textContent = 'Re-enter your PIN to confirm';
      updateDots(); return;
    }
    if(confirmPin !== pinInput){ document.getElementById('pin-error').textContent='PINs do not match. Try again.'; pinInput=''; confirmPin=''; updateDots(); return; }
    data.pin = pinInput; save(); unlock();
  } else {
    if(pinInput === data.pin){ unlock(); }
    else { document.getElementById('pin-error').textContent='Incorrect PIN. Try again.'; pinInput=''; updateDots(); }
  }
}
function unlock(){
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  initApp();
}

/* ---- App Init ---- */
function initApp(){
  populateCatSelects();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('tx-date').value = today;
  populateMonthFilter();
  renderDashboard(); renderTransactions(); renderBudget(); renderCharts();
}
function populateCatSelects(){
  const type = document.getElementById('tx-type').value;
  const cats = type === 'income' ? CATS_INCOME : CATS_EXPENSE;
  const sel = document.getElementById('tx-cat');
  sel.innerHTML = cats.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('budget-cat').innerHTML = CATS_EXPENSE.map(c=>`<option>${c}</option>`).join('');
}
document.getElementById('tx-type').addEventListener('change', populateCatSelects);

function populateMonthFilter(){
  const sel = document.getElementById('tx-month-filter');
  const months = new Set(data.txs.map(t=>t.date.slice(0,7)));
  const now = new Date().toISOString().slice(0,7);
  months.add(now);
  const sorted = [...months].sort().reverse();
  sel.innerHTML = sorted.map(m=>`<option value="${m}">${fmtMonth(m)}</option>`).join('');
}
function fmtMonth(ym){ const [y,m]=ym.split('-'); const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return mn[+m-1]+' '+y; }
function curMonth(){ return new Date().toISOString().slice(0,7); }

/* ---- Transactions ---- */
function addTransaction(){
  const amt = parseFloat(document.getElementById('tx-amount').value);
  if(!amt||amt<=0) return;
  const tx = {
    id: Date.now(),
    type: document.getElementById('tx-type').value,
    amount: amt,
    category: document.getElementById('tx-cat').value,
    date: document.getElementById('tx-date').value,
    note: document.getElementById('tx-note').value
  };
  data.txs.unshift(tx);
  document.getElementById('tx-amount').value='';
  document.getElementById('tx-note').value='';
  save();
  populateMonthFilter();
  renderAll();
}
function delTransaction(id){
  data.txs = data.txs.filter(t=>t.id!==id);
  save(); populateMonthFilter(); renderAll();
}

/* ---- Budget ---- */
function setBudget(){
  const cat = document.getElementById('budget-cat').value;
  const amt = parseFloat(document.getElementById('budget-amt').value);
  if(!amt||amt<=0) return;
  data.budgets[cat] = amt;
  document.getElementById('budget-amt').value='';
  save(); renderBudget();
}

/* ---- Renders ---- */
function renderAll(){ renderDashboard(); renderTransactions(); renderBudget(); renderCharts(); }

function renderDashboard(){
  const m = curMonth();
  const inc = data.txs.filter(t=>t.type==='income'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);
  const exp = data.txs.filter(t=>t.type==='expense'&&t.date.startsWith(m)).reduce((s,t)=>s+t.amount,0);
  const bal = data.txs.reduce((s,t)=>t.type==='income'?s+t.amount:s-t.amount,0);
  const rate = inc>0?Math.round((inc-exp)/inc*100):0;
  document.getElementById('dash-cards').innerHTML=`
    <div class="card"><div class="card-label">Total Balance</div><div class="card-val blue">₹${fmt(bal)}</div></div>
    <div class="card"><div class="card-label">This Month Income</div><div class="card-val green">₹${fmt(inc)}</div></div>
    <div class="card"><div class="card-label">This Month Expenses</div><div class="card-val red">₹${fmt(exp)}</div></div>
    <div class="card"><div class="card-label">Savings Rate</div><div class="card-val yellow">${rate}%</div></div>`;
  const recent = data.txs.slice(0,5);
  document.getElementById('dash-recent').innerHTML = recent.length
    ? recent.map(t=>txHTML(t)).join('')
    : '<div class="empty">No transactions yet</div>';
}

function renderTransactions(){
  const m = document.getElementById('tx-month-filter').value || curMonth();
  const txs = data.txs.filter(t=>t.date.startsWith(m));
  document.getElementById('tx-list').innerHTML = txs.length
    ? txs.map(t=>txHTML(t,true)).join('')
    : '<div class="empty">No transactions this month</div>';
}
function txHTML(t, showDel=false){
  return `<div class="tx-item">
    <div class="tx-cat">${t.category}</div>
    <div class="tx-info"><div class="tx-note">${t.note||'—'}<span class="badge ${t.type==='income'?'badge-inc':'badge-exp'}">${t.type}</span></div><div class="tx-date">${t.date}</div></div>
    <div class="tx-amt ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}₹${fmt(t.amount)}</div>
    ${showDel?`<button class="btn-danger" onclick="delTransaction(${t.id})">Del</button>`:''}
  </div>`;
}

function renderBudget(){
  const m = curMonth();
  const spent = {};
  data.txs.filter(t=>t.type==='expense'&&t.date.startsWith(m)).forEach(t=>{ spent[t.category]=(spent[t.category]||0)+t.amount; });
  const cats = Object.keys(data.budgets);
  if(!cats.length){ document.getElementById('budget-grid').innerHTML='<div class="empty">No budgets set yet.</div>'; return; }
  document.getElementById('budget-grid').innerHTML = cats.map(cat=>{
    const lim = data.budgets[cat], sp = spent[cat]||0, pct = Math.min(100,Math.round(sp/lim*100));
    const col = pct>90?'#ef4444':pct>70?'#f59e0b':'#22c55e';
    return `<div class="budget-card">
      <div class="budget-header"><span class="budget-cat">${cat}</span><span class="budget-amt">₹${fmt(sp)} / ₹${fmt(lim)}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="budget-footer"><span>${pct}% used</span><span>₹${fmt(lim-sp)} left</span></div>
    </div>`;
  }).join('');
}

function renderCharts(){
  const m = curMonth();
  // Donut - expense by category
  const expCats = {};
  data.txs.filter(t=>t.type==='expense'&&t.date.startsWith(m)).forEach(t=>{ expCats[t.category]=(expCats[t.category]||0)+t.amount; });
  const dLabels=Object.keys(expCats), dVals=Object.values(expCats);
  if(charts.donut) charts.donut.destroy();
  charts.donut = new Chart(document.getElementById('donut-chart'), {
    type:'doughnut', data:{labels:dLabels,datasets:[{data:dVals,backgroundColor:COLORS,borderWidth:0,hoverOffset:6}]},
    options:{plugins:{legend:{position:'bottom',labels:{color:'#9ca3af',boxWidth:12,padding:12}}},cutout:'65%'}
  });
  // Bar - monthly trend last 6 months
  const months=[], incArr=[], expArr=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    const k=d.toISOString().slice(0,7);
    months.push(fmtMonth(k));
    incArr.push(data.txs.filter(t=>t.type==='income'&&t.date.startsWith(k)).reduce((s,t)=>s+t.amount,0));
    expArr.push(data.txs.filter(t=>t.type==='expense'&&t.date.startsWith(k)).reduce((s,t)=>s+t.amount,0));
  }
  if(charts.bar) charts.bar.destroy();
  charts.bar = new Chart(document.getElementById('bar-chart'), {
    type:'bar', data:{labels:months,datasets:[
      {label:'Income',data:incArr,backgroundColor:'#22c55e99',borderRadius:6},
      {label:'Expenses',data:expArr,backgroundColor:'#ef444499',borderRadius:6}
    ]},
    options:{plugins:{legend:{labels:{color:'#9ca3af'}}},scales:{x:{ticks:{color:'#9ca3af'},grid:{color:'#1f2235'}},y:{ticks:{color:'#9ca3af'},grid:{color:'#1f2235'}}}}
  });
}

/* ---- PIN Change ---- */
function changePin(){
  const o=document.getElementById('s-old').value,n=document.getElementById('s-new').value,c=document.getElementById('s-conf').value;
  const msg=document.getElementById('pin-success');
  if(o!==data.pin){msg.style.color='#ef4444';msg.textContent='Current PIN is incorrect.';return;}
  if(n.length!==4||!/^\d{4}$/.test(n)){msg.style.color='#ef4444';msg.textContent='PIN must be 4 digits.';return;}
  if(n!==c){msg.style.color='#ef4444';msg.textContent='New PINs do not match.';return;}
  data.pin=n; save();
  msg.style.color='#22c55e'; msg.textContent='PIN updated successfully!';
  document.getElementById('s-old').value=document.getElementById('s-new').value=document.getElementById('s-conf').value='';
  setTimeout(()=>msg.textContent='',3000);
}

/* ---- Nav ---- */
function nav(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  event.currentTarget.classList.add('active');
  if(page==='charts') setTimeout(renderCharts,50);
}

function fmt(n){ return n.toLocaleString('en-IN',{maximumFractionDigits:0}); }

/* ---- Start ---- */
(async()=>{ await load(); initPin(); })();
</script>
